# mpv — réglages pour écrans SDR 4K sous Hyprland (Wayland natif)
vo=gpu-next
gpu-context=wayland
hwdec=auto-safe
# HDR vers SDR : tone mapping propre, pic de luminance calculé image par image
tone-mapping=bt.2446a
hdr-compute-peak=yes
target-colorspace-hint=no
# Fenêtre et lecture
keep-open=yes
save-position-on-quit=yes
sub-auto=fuzzy
alang=fr,fre,fra,en,eng
slang=fr,fre,fra,en,eng
