<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Segoe UI (Microsoft, propriétaire) -> Selawik (équivalent libre, mêmes dimensions) pour les pages Microsoft -->
<fontconfig>
  <alias binding="same">
    <family>Segoe UI</family>
    <prefer><family>Selawik</family></prefer>
  </alias>
  <alias binding="same">
    <family>Segoe UI Web</family>
    <prefer><family>Selawik</family></prefer>
  </alias>
</fontconfig>
