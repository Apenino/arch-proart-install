# Kitty — thème sobre façon Terminal/macOS
font_family      JetBrainsMono Nerd Font
font_size        11.5
window_padding_width 14
background_opacity 0.88
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
cursor_blink_interval 0.5
tab_bar_style powerline
tab_powerline_style round

foreground #e5e5e7
background #1e1e22
selection_background #3a3a40
cursor #e5e5e7
color0  #1e1e22
color8  #6e6e73
color1  #ff6961
color9  #ff8a80
color2  #63d97a
color10 #8cf0a0
color3  #ffd60a
color11 #ffe066
color4  #5ac8fa
color12 #7fd6ff
color5  #bf8cff
color13 #d4b0ff
color6  #64d2ff
color14 #9ce4ff
color7  #e5e5e7
color15 #ffffff

# Shell
shell /usr/bin/zsh

# Traînée du curseur (effet "comète" quand il saute, ex. retour chariot)
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
cursor_trail_color #5ac8fa
